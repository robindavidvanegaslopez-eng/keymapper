
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KeyMapperAndroid.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -o KeyMapperAndroid.zip -d .

      - name: Compilar APK
        working-directory: KeyMapperAndroid
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyMapper-debug-apk
          path: KeyMapperAndroid/app/build/outputs/apk/debug/app-debug.apk
          
