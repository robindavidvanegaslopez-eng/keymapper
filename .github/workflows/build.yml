name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar la carpeta del proyecto
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No hay settings.gradle.kts en el repositorio: el proyecto no se subió."
            echo "Archivos que sí hay:"
            ls -R | head -n 60
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Proyecto encontrado en: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (debug)
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KeyMapperPro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Publicar el APK en Releases (sin zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            --title "KeyMapper Pro build ${{ github.run_number }}" \
            --notes "APK debug" \
            --target "${{ github.sha }}"
