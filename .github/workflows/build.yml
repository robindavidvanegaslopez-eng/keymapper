steps:
  - uses: actions/checkout@v4

  - name: Extraer el ZIP
    run: |
      unzip -oq KeyMapperPro.zip -d extracted
      echo "Contenido extraído:"
      find extracted -maxdepth 3 -name gradlew -o -name build.gradle -o -name build.gradle.kts

  - name: Detectar proyecto
    run: |
      PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -n 1)")
      if [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
      fi
      if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
        echo "No se encontró el proyecto Gradle."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Proyecto encontrado en: $PROJECT_DIR"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: 8.7

  - name: Compilar APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: gradle assembleDebug --no-daemon

  - uses: actions/upload-artifact@v4
    with:
      name: KeyMapperPro-debug
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
